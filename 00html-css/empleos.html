<section class="jobs-search">
    <h1>Encuentra tu próximo trabajo</h1>
    <p>Explora miles de oportunidades laborales</p>

    <form role="search">
    <div class="search-bar">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" 
        height="24" viewBox="0 0 24 24" fill="none" 
        stroke="currentColor" stroke-width="2" stroke-linecap="round" 
        stroke-linejoin="round" 
        class="icon icon-tabler icons-tabler-outline icon-tabler-search">
        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
        <path d="M3 10a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" />
        <path d="M21 21l-6 -6" />
    </svg>
    <input required type="text" placeholder="buscar trabajos, empresas o habilidades">
    </div>

    <div class="search-filtres">
        <select name="technology" id="technology">
            <option value="">Tecnología</option>
            <option value="javascript">JavaScript</option>
            <option value="python">Python</option>
            <option value="java">Java</option>
            <option value="csharp">C#</option>
            <option value="react">React</option>
            <option value="nodejs">Node.js</option>
        </select>
         <select name="location" id="location">
            <option value="">Ubicación</option>
            <option value="madrid">Remoto</option>
            <option value="barcelona">Ciudad de mexico</option>
            <option value="valencia">Guadalajara</option>
            <option value="sevilla">Monterrey</option>
            <option value="buenos-aires">Barcelona</option>
            <option value="react">Sevilla</option>
            <option value="nodejs">Texas</option>
        </select>
        <select name="experience-level" id="experience-level">
            <option value="">Nivel de experiencia</option>
            <option value="junior">Junior</option>
            <option value="mid-level">Mid-level</option>
            <option value="senior">Senior</option>
            <option value="lead">Lead</option>
        </select>
    </div>
    <p id="mensaje-filtro" style="margin-top: 1rem; color: var(--primary-light);
     font-size: 0.9rem;"></p>
    </form>
</section>
